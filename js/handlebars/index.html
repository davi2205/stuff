<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script type="text/x-template" tn-item="partial" tn-name="test-row">
    <tr id="{{getid}}">
      <td>{{name}}</td>
      <td>{{hometown}}</td>
      <td><button onclick="alert('Hello, {{name}}!')">Greet</button></td>
      <td>

        <button class="remove-button">Remove</button>
      </td>
    </tr>
  </script>

  <script type="text/x-template" tn-item="template" tn-name="test">
    <div id="{{getid}}">    
      <table>
        <tbody>
          {{#each items}}
            {{> test-row}}
          {{/each}}
        </tbody>
      </table>

      <button class="button1">Add</button>
      <button class="button2">Remove</button>
      <button class="button3">Refresh</button>
      
      <div
        tn-item="event"
        tn-source="#{{getid}} .button1"
        tn-trigger="click"
        tn-action="button1Clicked">
      </div>
      <div
        tn-item="event"
        tn-source="#{{getid}} .button2"
        tn-trigger="click"
        tn-action="button2Clicked">
      </div>
      <div
        tn-item="event"
        tn-source="#{{getid}} .button3"
        tn-trigger="click"
        tn-action="button3Clicked">
      </div>

      {{#each items}}
        <div
          tn-item="event"
          tn-source="#{{getid}}-{{@index}} .remove-button"
          tn-trigger="click"
          tn-action="button4Clicked">
        </div>
      {{/each}}

    </div>
  </script>
 
  <script>
    // TODO: place everything in "render"

    function button1Clicked(event, context) {
      var items = context.data.items;
      items.push({ name: 'New Person', hometown: 'New Town' });
      
      var id = context.render.id;
      tn.renderTemplate(
        /*template*/ 'test-row',
        /*data*/ items[items.length - 1],
        /*place*/ 'beforeend',
        /*target*/ '#'+id+' tbody'
      );
    }

    function button2Clicked(event, context) {
      var items = context.data.items;
      items.pop();
      
      var id = context.render.id;
      document.querySelector('#'+id+' tbody tr:last-child').remove();
    }

    function button4Clicked(event, context) {
      var index = parseInt(event.currentTarget.closest('tr').id.split('-').pop(), 10);
      var items = context.data.items;
      items.splice(index, 1);
      
      var id = context.render.id;
      document.getElementById(id + '-' + index).remove();
    }

    function button3Clicked(event, context) {
      var id = context.render.id;
      tn.renderTemplate(
        /*template*/ 'test',
        /*data*/ context.data,
        /*place*/ 'replace',
        /*target*/ '#'+id
      );
    }
  </script>

  <div id="app">
  </div>

  <script src="js/handlebars.min.js"></script>
  <script>
    var tn = (function() {
      // templates
      // ----------------------------
      function registerTemplate(elt) {
        var item = elt.getAttribute('tn-item');
        if (item !== 'template' && item !== 'partial') {
          throw new Error('Invalid tn-item value: ' + item);
        }
        var name = elt.getAttribute('tn-name');
        if (!name) {
          throw new Error('Missing tn-name attribute for ' + item);
        }
        if (templates[name]) {
          throw new Error('Duplicate template name: ' + name);
        }
        var templateSource = elt.innerHTML;
        var template = handlebars.compile('{{#capture}}' + templateSource + '{{/capture}}');
        templates[name] = template;
        if (item === 'partial') {
          handlebars.registerPartial(name, template);
        }
      }

      function renderTemplate(name, data, place, targetOrSelector) {
        var target;
        if (typeof targetOrSelector === 'string') {
          target = document.querySelector(targetOrSelector);
          if (!target) {
            throw new Error('Target element not found for selector: ' + targetOrSelector);
          }
        } else if (targetOrSelector instanceof Element) {
          target = targetOrSelector;
        } else {
          throw new Error('Invalid target or selector: ' + targetOrSelector);
        }
        var template = templates[name];
        if (!template) {
          throw new Error('Template not found: ' + name);
        }
        //var renderVars = helperVarStack[helperVarStack.length - 1];
        var html = template(data);
        var elt;
        if (place === 'fill') {
          target.innerHTML = html;
          elt = target.children[0];
        } else if (place === 'replace') {
          target.insertAdjacentHTML('afterend', html);
          elt = nextElementSibling(target);
          target.remove();
        } else if (place === 'beforeend') {
          target.insertAdjacentHTML('beforeend', html);
          elt = target.children[target.children.length - 1];
        } else if (place === 'afterbegin') {
          target.insertAdjacentHTML('afterbegin', html);
          elt = target.children[0];
        } else if (place === 'beforebegin') {
          target.insertAdjacentHTML('beforebegin', html);
          elt = prevElementSibling(target);
        } else if (place === 'afterend') {
          target.insertAdjacentHTML('afterend', html);
          elt = nextElementSibling(target);
        } else {
          throw new Error('Unknown place value: ' + place);
        }
        forEachItem(elt, function(childElt, item) {
          if (item === 'template' || item === 'partial') {
            throw new Error('Nested templates/partials are not supported: ' + childElt.getAttribute('tn-name'));
          } else if (item === 'event') {
            initEvent(childElt, {render: {}, data: data});
          }
        });
      }

      var handlebars = Handlebars.create();
      var templates = {};

      // helpers
      // ----------------------------
      var helperVarStack = [];
      var topLevelId;

      function pushHelperVars() {
        var context = { id: generateUniqueId() };
        helperVarStack.push(context);
        if (helperVarStack.length === 1) {
          topLevelId = context.id;
        }
      }

      function popHelperVars() {
        var context = helperVarStack.pop();
      }

      handlebars.registerHelper('getid', function() {
        if (helperVarStack.length === 0) {
          throw new Error('No context available for getid helper');
        }
        return helperVarStack[helperVarStack.length - 1].id;
      });

      handlebars.registerHelper('capture', function(options) {
        pushHelperVars();
        var result = options.fn(this);
        popHelperVars();
        return topLevelId + ':' + result;
      });

      // events
      // ----------------------------
      function initEvent(elt, context) {
        context = context || {render: {}, data: {}};
        var sourceSelector = elt.getAttribute('tn-source');
        var trigger = elt.getAttribute('tn-trigger');
        var actionName = elt.getAttribute('tn-action');
        if (!sourceSelector || !trigger || !actionName) {
          throw new Error('Missing tn-source, tn-trigger, or tn-action attribute for event');
        }
        var sourceElement = document.querySelector(sourceSelector);
        if (!sourceElement) {
          throw new Error('Source element not found for selector: ' + sourceSelector);
        }
        var actionFunction = window[actionName];
        sourceElement.addEventListener(trigger, function(event) {
          if (typeof actionFunction === 'function') {
            actionFunction(event, context);
          } else {
            throw new Error('Action function not found: ' + actionName);
          }
        });
      }

      // helpers
      // ----------------------------
      function forEachItem(root, callback) {
        var itemElts = root.querySelectorAll('[tn-item]');
        var i, len;
        for (i = 0, len = itemElts.length; i < len; i++) {
          var itemElt = itemElts[i];
          var item = itemElt.getAttribute('tn-item');
          callback(itemElt, item);
        }
      }

      function nextElementSibling(elt) {
        var sibling = elt.nextSibling;
        while (sibling && sibling.nodeType !== 1) {
          sibling = sibling.nextSibling;
        }
        return sibling;
      }

      function prevElementSibling(elt) {
        var sibling = elt.previousSibling;
        while (sibling && sibling.nodeType !== 1) {
          sibling = sibling.previousSibling;
        }
        return sibling;
      }

      function generateUniqueId() {
        return 'tn-' + Math.random().toString(36).substr(2, 9);
      }
    
      // initialization
      // ----------------------------
      forEachItem(document, function(elt, item) {
        if (item === 'template' || item === 'partial') {
          registerTemplate(elt);
        } else if (item === 'event') {
          initEvent(elt);
        }
      });

      return {
        renderTemplate: renderTemplate
      };
    })();
  </script>
  <script>
    // Example usage
    var data = {
      items: [
        { name: 'Alice', hometown: 'Wonderland' },
        { name: 'Bob', hometown: 'Builderland' },
        { name: 'Charlie', hometown: 'Chocolate Factory' }
      ]
    };
    tn.renderTemplate('test', data, 'fill', '#app');
  </script>
</body>

</html>
